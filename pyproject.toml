[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "virtbot"
version = "1.0.0"
description = "Telegram Virtual Currency Bot with Mini App"
requires-python = ">=3.10"
dependencies = [
    "aiogram==3.14.0",
    "aiohttp==3.10.1",
    "python-dotenv==1.0.1",
    "certifi==2024.12.14",
    "idna==3.10",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=5.0.0",
]
