<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtBot Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
            color: #00ff41;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid #00ff41;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3), inset 0 0 20px rgba(0, 255, 65, 0.05);
        }

        h1 {
            color: #00ff41;
            text-align: center;
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #00ff41, 0 0 20px rgba(0, 255, 65, 0.5);
            animation: glow-pulse 2s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 10px #00ff41, 0 0 20px rgba(0, 255, 65, 0.5); }
            50% { text-shadow: 0 0 20px #00ff41, 0 0 40px rgba(0, 255, 65, 0.8); }
        }

        .subtitle {
            color: #00cc33;
            text-align: center;
            font-size: 12px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            color: #00ff41;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .project-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .project-btn {
            padding: 12px;
            border: 2px solid #00ff41;
            background: rgba(0, 255, 65, 0.05);
            color: #00ff41;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .project-btn:hover {
            background: rgba(0, 255, 65, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
        }

        .project-btn.active {
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 100%);
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.8), inset 0 0 10px rgba(0, 255, 65, 0.3);
        }



        .input-group {
            margin-bottom: 15px;
        }

        .input-label {
            color: #00ff41;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .quantity-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #00ff41;
            background: rgba(0, 255, 65, 0.05);
            color: #00ff41;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .quantity-input:focus {
            outline: none;
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
        }

        .quantity-input::placeholder {
            color: rgba(0, 255, 65, 0.5);
        }

        .unit {
            color: #00cc33;
            font-size: 11px;
            font-weight: bold;
            min-width: 60px;
            padding: 10px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 6px;
            text-align: center;
        }

        .server-list {
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 8px;
            padding: 0;
        }

        .server-item {
             padding: 12px;
             border: 2px solid rgba(0, 255, 65, 0.3);
             background: rgba(0, 255, 65, 0.02);
             border-radius: 8px;
             cursor: pointer;
             margin-bottom: 8px;
             transition: all 0.3s;
             display: flex;
             justify-content: space-between;
             align-items: center;
         }

        .server-name {
             color: #00ff41;
             font-weight: 600;
             font-size: 13px;
         }

        .server-details {
             display: flex;
             flex-direction: column;
             align-items: flex-end;
             gap: 4px;
         }

        .server-price {
             color: #00cc33;
             font-weight: bold;
             font-size: 12px;
         }

        .server-stock {
             color: #00ff41;
             font-size: 10px;
             opacity: 0.8;
         }

        .server-item:hover {
             background: rgba(0, 255, 65, 0.1);
             border-color: rgba(0, 255, 65, 0.6);
             box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
         }

        .server-item.active {
             background: rgba(0, 255, 65, 0.15);
             border-color: #00ff41;
             box-shadow: 0 0 15px rgba(0, 255, 65, 0.5), inset 0 0 5px rgba(0, 255, 65, 0.1);
         }

        .info-block {
            background: rgba(0, 255, 65, 0.08);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #00ff41;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
        }

        .info-label {
            opacity: 0.7;
        }

        .info-value {
            font-weight: bold;
            color: #00ff41;
        }

        .total-price {
            background: linear-gradient(135deg, rgba(0, 255, 65, 0.1) 0%, rgba(0, 204, 51, 0.05) 100%);
            border: 2px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .total-label {
            color: #00cc33;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .total-value {
            color: #00ff41;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff41;
        }

        .currency {
            font-size: 16px;
            opacity: 0.8;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 100%);
            color: #0a0e27;
            border: 2px solid #00ff41;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
        }

        .checkout-btn:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.8);
            transform: translateY(-2px);
        }

        .checkout-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .checkout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 255, 65, 0.05);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ VIRTBOT</h1>
        <div class="subtitle">Приобретите виртуальную валюту</div>

        <!-- Выбор проекта -->
        <div class="section">
            <div class="section-title">🎮 Шаг 1: Выберите проект</div>
            <div class="project-selector">
                <button class="project-btn active" onclick="selectProject('russia', this)">Россия Онлайн</button>
                <button class="project-btn" onclick="selectProject('majestic', this)">Majestic RP</button>
            </div>
        </div>



        <!-- Ввод количества -->
         <div class="section">
             <div class="input-group">
                 <label class="input-label">📊 Шаг 2: Количество</label>
                 <div class="input-wrapper">
                     <input type="number" class="quantity-input" id="virtInput" 
                            placeholder="Введите количество" 
                            onchange="updateCalculation()"
                            oninput="updateCalculation()"
                            min="1">
                     <div class="unit">тыс.</div>
                 </div>
             </div>
         </div>

        <!-- Выбор сервера -->
         <div class="section">
             <div class="section-title">🌍 Шаг 3: Выберите сервер</div>
             <div class="server-list" id="serverList"></div>
         </div>

        <!-- Информация о заказе -->
         <div class="info-block">
             <div class="info-row">
                 <span class="info-label">Проект:</span>
                 <span class="info-value" id="selectedProject">Россия Онлайн</span>
             </div>
             <div class="info-row">
                 <span class="info-label">Количество:</span>
                 <span class="info-value" id="selectedQuantity">-</span>
             </div>
             <div class="info-row">
                 <span class="info-label">Сервер:</span>
                 <span class="info-value" id="selectedServer">Не выбран</span>
             </div>
         </div>

        <!-- Итоговая цена -->
        <div class="total-price">
            <div class="total-label">Итого к оплате</div>
            <div class="total-value">
                <span id="totalPrice">0</span><span class="currency"> ₽</span>
            </div>
        </div>

        <!-- Кнопка оформления -->
        <button class="checkout-btn" onclick="checkout()" id="checkoutBtn" disabled>
            ✅ Оформить заказ
        </button>
    </div>

    <script>
        // Данные серверов с ценами и наличием
        // price = цена за 1К виртов
        // stock = наличие виртов на сервере (в ккк)
        const servers = [
            { name: "№01 New York", price: 0.840, stock: 384 },
            { name: "№02 Detroit", price: 0.390, stock: 217 },
            { name: "№03 Chicago", price: 0.370, stock: 463 },
            { name: "№04 San Francisco", price: 0.230, stock: 291 },
            { name: "№05 Atlanta", price: 0.280, stock: 176 },
            { name: "№06 San Diego", price: 0.310, stock: 428 },
            { name: "№07 Los Angeles", price: 0.310, stock: 352 },
            { name: "№08 Miami", price: 0.300, stock: 249 },
            { name: "№09 Las Vegas", price: 0.240, stock: 491 },
            { name: "№10 Washington", price: 0.230, stock: 318 },
            { name: "№11 Dallas", price: 0.370, stock: 203 },
            { name: "№12 Boston", price: 0.310, stock: 447 },
            { name: "№13 Houston", price: 0.540, stock: 269 },
            { name: "№14 Seattle", price: 0.290, stock: 376 },
            { name: "№15 Phoenix", price: 0.290, stock: 158 },
            { name: "№16 Denver", price: 0.300, stock: 412 },
            { name: "№17 Portland", price: 0.300, stock: 326 },
            { name: "№18 Orlando", price: 0.480, stock: 184 },
            { name: "№19 Memphis", price: 0.490, stock: 475 },
            { name: "Russia.online Тверской", price: 0.600, stock: 186 },
            { name: "Russia.online Кутузовский", price: 0.540, stock: 273 },
            { name: "Russia.online Арбатский", price: 0.490, stock: 224 }
        ];

        let selectedProject = 'russia';
        let selectedServer = null;
        let selectedQuantity = 0;
        let TelegramWebApp = window.Telegram?.WebApp;

        // Инициализация Mini App
        if (TelegramWebApp) {
            TelegramWebApp.ready();
            TelegramWebApp.expand();
        }

        // Рендеринг списка серверов
         function renderServers() {
             const list = document.getElementById('serverList');
             list.innerHTML = servers.map((server, index) => `
                 <div class="server-item" onclick="selectServer(${index}, this)">
                     <span class="server-name">${server.name}</span>
                     <div class="server-details">
                         <span class="server-price">${server.price.toFixed(2)} ₽</span>
                         <span class="server-stock">Наличие: ${server.stock}кк</span>
                     </div>
                 </div>
             `).join('');
         }

        // Выбрать проект
        function selectProject(project, btn) {
            selectedProject = project;
            selectedServer = null;

            document.querySelectorAll('.project-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('selectedProject').textContent = 
                project === 'russia' ? 'Россия Онлайн' : 'Majestic RP';

            document.querySelectorAll('.server-item').forEach(item => item.classList.remove('active'));
            updateCalculation();
        }

        // Выбрать сервер
        function selectServer(index, element) {
            selectedServer = index;

            document.querySelectorAll('.server-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('selectedServer').textContent = servers[index].name;
            updateCalculation();
        }

        // Обновить расчет
         function updateCalculation() {
             const input = document.getElementById('virtInput').value.trim();

             if (!input) {
                 selectedQuantity = 0;
                 document.getElementById('selectedQuantity').textContent = '-';
                 document.getElementById('totalPrice').textContent = '0';
                 document.getElementById('checkoutBtn').disabled = true;
                 return;
             }

             const quantity = parseInt(input) || 0;

             if (quantity < 1) {
                 document.getElementById('totalPrice').textContent = '0';
                 document.getElementById('checkoutBtn').disabled = true;
                 return;
             }

             selectedQuantity = quantity;
             document.getElementById('selectedQuantity').textContent = quantity + ' тыс.';

             if (selectedServer !== null) {
                 const server = servers[selectedServer];
                 const totalPrice = server.price * quantity;
                 document.getElementById('totalPrice').textContent = totalPrice.toFixed(2);
                 document.getElementById('checkoutBtn').disabled = false;
             } else {
                 document.getElementById('totalPrice').textContent = '0';
                 document.getElementById('checkoutBtn').disabled = true;
             }
         }

        // Оформить заказ
         function checkout() {
             if (selectedQuantity < 1) {
                 alert('Введите количество!');
                 return;
             }

             if (selectedServer === null) {
                 alert('Пожалуйста, выберите сервер!');
                 return;
             }

             const server = servers[selectedServer];
             const project = selectedProject === 'russia' ? 'Россия Онлайн' : 'Majestic RP';
             const totalPrice = server.price * selectedQuantity;

             const orderData = {
                 project: project,
                 type: '1К Виртов',
                 quantity: selectedQuantity,
                 server: server.name,
                 pricePerUnit: server.price.toFixed(2),
                 totalPrice: totalPrice.toFixed(2)
             };

             if (TelegramWebApp) {
                 TelegramWebApp.sendData(JSON.stringify(orderData));
             } else {
                 console.log('Заказ:', orderData);
                 alert(`Заказ:\\n${project}\\n${selectedQuantity} 1К Виртов\\nСервер: ${server.name}\\nИтого: ${totalPrice.toFixed(2)} ₽`);
             }
         }

            if (selectedServer === null) {
                alert('Пожалуйста, выберите сервер!');
                return;
            }

            const server = servers[selectedServer];
            const project = selectedProject === 'russia' ? 'Россия Онлайн' : 'Majestic RP';
            const productType = selectedProduct === '1k' ? '1К Виртов' : '1КК Виртов';
            const price = getPrice(server);
            const totalPrice = price * selectedQuantity;

            const orderData = {
                project: project,
                type: productType,
                quantity: selectedQuantity,
                server: server.name,
                pricePerUnit: price.toFixed(2),
                totalPrice: totalPrice.toFixed(2)
            };

            if (TelegramWebApp) {
                TelegramWebApp.sendData(JSON.stringify(orderData));
            } else {
                console.log('Заказ:', orderData);
                alert(`Заказ:\n${project}\n${selectedQuantity} ${productType}\nСервер: ${server.name}\nИтого: ${totalPrice.toFixed(2)} ₽`);
            }
        }

        // Инициализировать при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            renderServers();
            updateCalculation();
        });
    </script>
</body>
</html>
